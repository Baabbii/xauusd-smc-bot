name: Signal Check (Cloud)

on:
  schedule:
    # la fiecare 15 minute -- GitHub poate intarzia cateva minute in
    # perioade aglomerate, e normal, nu inseamna ca nu functioneaza
    - cron: "*/15 * * * *"
  workflow_dispatch: {}   # iti permite sa il rulezi si manual, din tab-ul Actions

permissions:
  contents: write   # necesar ca sa poata salva state.json inapoi in repo

jobs:
  check_signals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalează dependențele
        run: pip install -r requirements.txt

      - name: Verifică semnale și trimite alertă
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python cloud_run.py

      - name: Salvează state.json înapoi în repo
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Actualizează state.json [skip ci]"
          git push
